name: Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Make build script executable
      run: chmod +x build_dmg.sh
      
    - name: Build and package
      run: ./build_dmg.sh
      
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moyu-build-${{ github.sha }}
        path: build/Moyu-*.dmg
        retention-days: 7


