name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的 tag 时触发，例如 v1.0.0
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write  # 需要写入权限来创建 release 和 tag
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史记录，用于创建 tag
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Get version from tag
      id: get_version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
    - name: Set version from input
      id: set_version
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        
    - name: Set version environment variable
      run: |
        VERSION="${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "✅ 版本已设置为: $VERSION"
        
    - name: Make build script executable
      run: chmod +x build_dmg.sh
      
    - name: Build and package
      env:
        VERSION: ${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}
      run: ./build_dmg.sh
      
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moyu-${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}.dmg
        path: build/Moyu-*.dmg
        retention-days: 30
        
    - name: Find DMG file
      id: find_dmg
      run: |
        DMG_FILE=$(ls build/Moyu-*.dmg 2>/dev/null | head -n 1)
        if [ -z "$DMG_FILE" ]; then
          echo "❌ 错误: 找不到 DMG 文件"
          exit 1
        fi
        echo "file=$DMG_FILE" >> $GITHUB_OUTPUT
        echo "✅ 找到 DMG 文件: $DMG_FILE"
        
    - name: Create tag if not exists (manual trigger)
      if: github.event_name == 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${{ steps.set_version.outputs.tag }}"
        echo "🔍 检查 tag: $TAG_NAME"
        
        # 获取远程 tag 列表
        git fetch --tags --force
        
        # 检查 tag 是否已存在（本地或远程）
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
          echo "ℹ️ Tag $TAG_NAME 已存在，跳过创建"
        else
          echo "🏷️ 创建新 tag: $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          
          # 使用 GITHUB_TOKEN 推送 tag
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin "$TAG_NAME"
          echo "✅ Tag $TAG_NAME 创建并推送成功"
          
          # 等待一下确保 tag 已经同步
          sleep 2
        fi
        
    - name: Verify tag exists
      id: verify_tag
      run: |
        TAG_NAME="${{ steps.get_version.outputs.tag || steps.set_version.outputs.tag }}"
        echo "🔍 验证 tag 是否存在: $TAG_NAME"
        
        # 再次获取远程 tag
        git fetch --tags --force
        
        # 检查 tag 是否存在
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
          echo "✅ Tag $TAG_NAME 已确认存在"
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "❌ 错误: Tag $TAG_NAME 不存在，无法创建 release"
          exit 1
        fi
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.find_dmg.outputs.file }}
        tag_name: ${{ steps.get_version.outputs.tag || steps.set_version.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.tag || steps.set_version.outputs.tag }}
        body: |
          ## Moyu 摸鱼背单词 v${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}
          
          ### 📦 下载
          
          下载 `Moyu-${{ steps.get_version.outputs.version || steps.set_version.outputs.version }}.dmg` 文件并安装。
          
          ### 📝 安装说明
          
          如果遇到"无法打开，因为无法验证开发者"的提示：
          
          1. **方法一（推荐）**：右键点击 `Moyu.app`，选择"打开"
          2. **方法二**：打开"系统设置" > "隐私与安全性"，点击"仍要打开"
          3. **方法三**：在终端运行 `xattr -cr /Applications/Moyu.app`
          
          ### ✨ 更新内容
          
          - 查看 [CHANGELOG.md](../CHANGELOG.md) 了解详细更新内容
          
        draft: false
        prerelease: false
        generate_release_notes: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

