name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的 tag 时触发，例如 v1.0.0
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Get version from tag
      id: get_version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
    - name: Set version from input
      id: set_version
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        
    - name: Set version environment variable
      run: |
        VERSION="${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "✅ 版本已设置为: $VERSION"
        
    - name: Make build script executable
      run: chmod +x build_dmg.sh
      
    - name: Build and package
      env:
        VERSION: ${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}
      run: ./build_dmg.sh
      
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moyu-${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}.dmg
        path: build/Moyu-*.dmg
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/Moyu-*.dmg
        name: Release ${{ steps.get_version.outputs.tag }}
        body: |
          ## Moyu 摸鱼背单词 v${{ steps.get_version.outputs.version }}
          
          ### 📦 下载
          
          下载 `Moyu-${{ steps.get_version.outputs.version }}.dmg` 文件并安装。
          
          ### 📝 安装说明
          
          如果遇到"无法打开，因为无法验证开发者"的提示：
          
          1. **方法一（推荐）**：右键点击 `Moyu.app`，选择"打开"
          2. **方法二**：打开"系统设置" > "隐私与安全性"，点击"仍要打开"
          3. **方法三**：在终端运行 `xattr -cr /Applications/Moyu.app`
          
          ### ✨ 更新内容
          
          - 查看 [CHANGELOG.md](../CHANGELOG.md) 了解详细更新内容
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

