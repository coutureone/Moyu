name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 2.1.0)'
        required: true
        default: '2.1.0'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Get version from tag
      id: get_version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
    - name: Set version from input
      id: set_version
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        
    - name: Set version environment variable
      run: |
        VERSION="${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '2.1.0' }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
    - name: Make build script executable
      run: chmod +x build_dmg.sh
      
    - name: Build (Universal Binary)
      env:
        VERSION: ${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '2.1.0' }}
      run: |
        ./build_dmg.sh
        
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Moyu-${{ env.VERSION }}
        path: build/Moyu-*.dmg
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all DMG artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: Moyu-*
        merge-multiple: true
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*.dmg
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
        name: Release ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
        body: |
          ## Moyu 摸鱼背单词 ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          
          ### 📦 下载
          
          下载 `Moyu-x.x.x.dmg` 文件并安装，支持 Apple Silicon (M1/M2/M3) 和 Intel Mac。
          
          ### 📝 安装说明
          
          如果遇到"无法打开，因为无法验证开发者"的提示：
          
          1. **方法一（推荐）**：右键点击 `Moyu.app`，选择"打开"
          2. **方法二**：打开"系统设置" > "隐私与安全性"，点击"仍要打开"
          3. **方法三**：在终端运行 `xattr -cr /Applications/Moyu.app`
          
          ### ✨ 更新内容
          
          - 数据管理：清空错词本、清空收藏、重置全部进度、导出/导入学习数据
          - 词库管理：所有内置词库展示，自定义词库重命名/删除，导入预览和错误提示
          - macOS 登录项：开机启动现在接入系统 API
          - 摸鱼模式：透明度、小窗、固定角落、隐藏/唤醒快捷键配置
          - 查看 [CHANGELOG.md](../CHANGELOG.md) 了解详细更新内容
          
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
