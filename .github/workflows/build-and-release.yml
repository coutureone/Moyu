name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Get version from tag
      id: get_version
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
    - name: Set version from input
      id: set_version
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        
    - name: Set version environment variable
      run: |
        VERSION="${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
    - name: Make build script executable
      run: chmod +x build_dmg.sh
      
    - name: Build for Apple Silicon
      env:
        VERSION: ${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}
      run: |
        xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Release -arch arm64 build
        ./build_dmg.sh
        
    - name: Build for Intel
      env:
        VERSION: ${{ steps.get_version.outputs.version || steps.set_version.outputs.version || '1.0.0' }}
      run: |
        xcodebuild -project Moyu.xcodeproj -scheme Moyu -configuration Release -arch x86_64 build
        ./build_dmg.sh
        
    - name: Upload Apple Silicon DMG
      uses: actions/upload-artifact@v4
      with:
        name: Moyu-AppleSilicon
        path: build/Moyu-*.dmg
        retention-days: 30

    - name: Upload Intel DMG
      uses: actions/upload-artifact@v4
      with:
        name: Moyu-Intel
        path: build/Moyu-*.dmg
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all DMG artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: Moyu-*
        merge-multiple: true
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*.dmg
        tag_name: ${{ github.ref }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Moyu 摸鱼背单词 ${{ github.ref_name }}
          
          ### 📦 下载
          
          支持 Apple Silicon (M1/M2/M3) 和 Intel Mac：
          
          - **Apple Silicon**: `Moyu-AppleSilicon-*.dmg`
          - **Intel**: `Moyu-Intel-*.dmg`
          
          ### 📝 安装说明
          
          如果遇到"无法打开，因为无法验证开发者"的提示：
          
          1. **方法一（推荐）**：右键点击 `Moyu.app`，选择"打开"
          2. **方法二**：打开"系统设置" > "隐私与安全性"，点击"仍要打开"
          3. **方法三**：在终端运行 `xattr -cr /Applications/Moyu.app`
          
          ### ✨ 更新内容
          
          - 查看 [CHANGELOG.md](../CHANGELOG.md) 了解详细更新内容
          
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
